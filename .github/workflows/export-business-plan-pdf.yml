name: Publish BlockNet business plan PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-business-plan-pdf.yml'
      - 'docs/BlockNet_Business_Plan_2026.docx'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the business plan
        uses: actions/checkout@v4

      - name: Install LibreOffice PDF converter
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Export the complete business plan as PDF
        run: |
          mkdir -p /tmp/blocknet-pdf
          libreoffice -env:UserInstallation=file:///tmp/blocknet-libreoffice --headless --convert-to pdf --outdir /tmp/blocknet-pdf docs/BlockNet_Business_Plan_2026.docx
          test -s /tmp/blocknet-pdf/BlockNet_Business_Plan_2026.pdf
          mv /tmp/blocknet-pdf/BlockNet_Business_Plan_2026.pdf docs/BlockNet_Business_Plan_2026.pdf

      - name: Commit generated PDF into repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/BlockNet_Business_Plan_2026.pdf
          if git diff --cached --quiet; then
            echo 'PDF is already current.'
          else
            git commit -m 'Publish 47-page BlockNet business plan PDF'
            git push
          fi
